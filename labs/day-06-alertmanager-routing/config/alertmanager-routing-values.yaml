# Day 6 override for the existing `monitoring` Helm release.
#
# This is intentionally local and credential-free. `platform-training` is a
# named receiver with no external integration. In production, it would contain
# a Slack, PagerDuty, email, or webhook configuration.
alertmanager:
  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: default-null
      group_by:
        - team
        - service
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 4h
      routes:
        # Keep the synthetic Watchdog alert out of the training receiver.
        - matchers:
            - alertname = "Watchdog"
          receiver: default-null

        # The Day 5 error-rate and latency alerts share these labels, so they
        # become one service incident group.
        - matchers:
            - team = "platform"
            - service = "orders-api"
          receiver: platform-training
          group_by:
            - team
            - service
          group_wait: 15s
          group_interval: 2m
          repeat_interval: 4h

    receivers:
      - name: default-null
      - name: platform-training

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal:
          - namespace
          - alertname
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal:
          - namespace
      - target_matchers:
          - alertname = InfoInhibitor
