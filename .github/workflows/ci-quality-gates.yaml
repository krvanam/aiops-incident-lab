name: CI quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository inputs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.8'

      - name: Install CI-only Python dependency
        run: python -m pip install --disable-pip-version-check -r labs/day-11-ci-quality-gates/config/requirements-ci.txt

      - name: Validate YAML structure
        run: python labs/day-11-ci-quality-gates/scripts/validate_yaml.py

      - name: Compile Python automation
        run: |
          python -m py_compile labs/day-04-application-sli-slo/app/main.py
          python -m py_compile labs/day-10-aiops-incident-copilot/scripts/incident_copilot.py

      - name: Validate guarded remediation shell syntax
        run: bash -n labs/day-09-incident-runbooks-remediation/scripts/orders-api-guarded-remediation.sh

      - name: Client-side validate core Kubernetes manifests
        run: |
          kubectl apply --dry-run=client --validate=false -f labs/day-01-kubernetes-foundations/k8s/
          kubectl apply --dry-run=client --validate=false -f labs/day-04-application-sli-slo/k8s/10-orders-api.yaml
